[project]
name = "ha-ps5"
version = "0.1.0"
description = "Home Assistant custom integration for PS5 library and remote downloads"
license = "MIT"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:josepy.*"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "C4", "PIE", "PT", "RET", "TID"]
ignore = [
    "E501",     # handled by the formatter
    "PLR0911",  # too many return statements
    "PLR0912",  # too many branches
    "PLR0913",  # too many arguments
    "PLR0915",  # too many statements
    "PLR2004",  # magic values
    "RUF001",   # ambiguous unicode (fixtures contain an em dash)
    "RUF012",   # HA entity class attributes
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC0415", "SLF001", "PT012"]
